# LLMFit RTX 2060 Super + 32GB DDR4 Model Comparison Website
# Run with: docker-compose up --build

version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - llmfit-network

networks:
  llmfit-network:
    driver: bridge
